{% extends "base.html" %}
{% block title %}Join Ngaithla teh{% endblock %}
{% block content %}<section class="auth-panel"><p class="eyebrow">Start listening</p><h1>Create your account</h1><form method="post" class="form-card"><label for="username">Username</label><input id="username" name="username" maxlength="50" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required><button class="button" type="submit">Create account</button></form><p class="form-footnote">Already a member? <a href="{{ url_for('login') }}">Log in</a>.</p></section>{% endblock %}
